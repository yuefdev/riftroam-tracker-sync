name: Update Valorant profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: valorant-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-15-intel
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python sync.py
        env:
          PROFILE_SYNC_KEY: ${{ secrets.PROFILE_SYNC_KEY }}
